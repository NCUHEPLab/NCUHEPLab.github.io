<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">sPHENIX — nuclear matter and proton spin</title>
  <desc id="desc">A conceptual illustration inspired by sPHENIX: two incoming nuclei, a luminous heavy-ion collision region, outgoing particle tracks and jets, and concentric detector layers. Blue and orange on a dark background, with open space on the left for a website headline. Detector geometry and particle paths are illustrative.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111C36"/>
      <stop offset=".6" stop-color="#1C2B4E"/>
      <stop offset="1" stop-color="#30497C"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#4C6AAC" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4C6AAC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plasma">
      <stop stop-color="#FFE2C6" stop-opacity=".95"/>
      <stop offset=".25" stop-color="#F2A06C" stop-opacity=".85"/>
      <stop offset=".6" stop-color="#CA561F" stop-opacity=".6"/>
      <stop offset="1" stop-color="#CA561F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam">
      <stop stop-color="#CA561F" stop-opacity="0"/>
      <stop offset="1" stop-color="#F2A06C" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="shade">
      <stop stop-color="#111C36" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#111C36" stop-opacity=".3"/>
      <stop offset="1" stop-color="#111C36" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#A8BCE6" stroke-opacity=".045"/>
    </pattern>
    <g id="nucleus">
      <circle r="37" fill="#4C6AAC" fill-opacity=".12" stroke="#A8BCE6" stroke-opacity=".25"/>
      <g fill="#A8BCE6" fill-opacity=".7">
        <circle cx="-15" cy="-14" r="7"/><circle cx="4" cy="-22" r="7"/>
        <circle cx="21" cy="-10" r="7"/><circle cx="-23" cy="5" r="7"/>
        <circle cx="-8" cy="20" r="7"/><circle cx="13" cy="19" r="7"/>
      </g>
      <g fill="#CA561F">
        <circle r="8"/><circle cx="21" cy="8" r="7"/><circle cx="-5" cy="-10" r="6"/>
      </g>
    </g>
    <g id="module" fill="none" stroke="#A8BCE6" stroke-opacity=".4">
      <path d="M-8-284H8V-306H-8Z"/>
      <path d="M0-208V-223"/>
    </g>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1170" cy="450" rx="520" ry="470" fill="url(#halo)"/>
  <!-- Layered detector silhouette; a conceptual view, not a technical diagram. -->
  <g transform="translate(1155 450) rotate(12)" fill="none">
    <circle r="340" stroke="#A8BCE6" stroke-opacity=".1"/>
    <circle r="316" stroke="#4C6AAC" stroke-width="28" stroke-opacity=".35" stroke-dasharray="79 4"/>
    <circle r="285" stroke="#A8BCE6" stroke-opacity=".28"/>
    <circle r="265" stroke="#4C6AAC" stroke-width="17" stroke-opacity=".7" stroke-dasharray="31 3"/>
    <circle r="239" stroke="#CA561F" stroke-width="12" stroke-opacity=".65" stroke-dasharray="9 3"/>
    <circle r="212" stroke="#A8BCE6" stroke-opacity=".3"/>
    <circle r="184" stroke="#A8BCE6" stroke-opacity=".14" stroke-width="26"/>
    <circle r="157" stroke="#A8BCE6" stroke-opacity=".22"/>
    <circle r="127" stroke="#A8BCE6" stroke-opacity=".2" stroke-dasharray="1 8" stroke-width="3"/>
    <circle r="95" stroke="#4C6AAC" stroke-opacity=".9" stroke-width="3" stroke-dasharray="20 3"/>
    <circle r="75" stroke="#A8BCE6" stroke-opacity=".65" stroke-width="2" stroke-dasharray="14 3"/>
    <circle r="53" stroke="#A8BCE6" stroke-opacity=".5"/>
    <g>
      <use href="#module"/><use href="#module" transform="rotate(30)"/>
      <use href="#module" transform="rotate(60)"/><use href="#module" transform="rotate(90)"/>
      <use href="#module" transform="rotate(120)"/><use href="#module" transform="rotate(150)"/>
      <use href="#module" transform="rotate(180)"/><use href="#module" transform="rotate(210)"/>
      <use href="#module" transform="rotate(240)"/><use href="#module" transform="rotate(270)"/>
      <use href="#module" transform="rotate(300)"/><use href="#module" transform="rotate(330)"/>
    </g>
  </g>
  <!-- Incoming nuclei frame the interaction point. -->
  <path d="M690 450H1115" stroke="url(#beam)" stroke-width="2"/>
  <path d="M1600 450H1195" stroke="#A8BCE6" stroke-opacity=".35" stroke-width="2"/>
  <use href="#nucleus" transform="translate(884 450) scale(.8)"/>
  <use href="#nucleus" transform="translate(1430 450) scale(.8) rotate(24)"/>
  <g fill="none" stroke="#A8BCE6" stroke-opacity=".3">
    <path d="m929 450 14-5m-14 5 14 5M1380 450l-14-5m14 5-14 5"/>
  </g>
  <!-- The orange overlap region evokes hot nuclear matter. -->
  <ellipse cx="1155" cy="450" rx="90" ry="111" fill="url(#plasma)"/>
  <ellipse cx="1155" cy="450" rx="34" ry="58" fill="#CA561F" fill-opacity=".22" stroke="#F2A06C" stroke-opacity=".5"/>
  <!-- Dense event tracks and two contrasting jet-like fans. -->
  <g fill="none" stroke="#A8BCE6" stroke-linecap="round" stroke-opacity=".55" stroke-width="1.5">
    <path d="M1155 450Q1079 385 1071 264"/>
    <path d="M1155 450Q1139 338 1184 254"/>
    <path d="M1155 450Q1211 338 1282 321"/>
    <path d="M1155 450Q1285 403 1353 431"/>
    <path d="M1155 450Q1276 493 1308 552"/>
    <path d="M1155 450Q1165 573 1220 631"/>
    <path d="M1155 450Q1129 571 1078 609"/>
    <path d="M1155 450Q1042 492 995 465"/>
    <path d="M1155 450Q1083 459 1049 394"/>
    <path d="M1155 450Q1184 490 1158 541"/>
    <path d="M1155 450Q1194 428 1216 456T1242 500"/>
  </g>
  <path d="M1155 450 1377 193 1450 276Z" fill="#CA561F" fill-opacity=".08"/>
  <g fill="none" stroke="#F2A06C" stroke-linecap="round">
    <path d="M1155 450Q1272 297 1409 228" stroke-width="3"/>
    <path d="M1155 450Q1241 303 1377 193" stroke-opacity=".65" stroke-width="1.5"/>
    <path d="M1155 450Q1297 336 1450 276" stroke-opacity=".6" stroke-width="1.5"/>
    <path d="M1155 450Q1277 322 1410 260" stroke-opacity=".4"/>
  </g>
  <path d="M1155 450 928 666 962 697Z" fill="#4C6AAC" fill-opacity=".15"/>
  <g fill="none" stroke="#A8BCE6" stroke-linecap="round">
    <path d="M1155 450Q1061 595 944 683" stroke-width="2.5"/>
    <path d="M1155 450Q1033 579 928 666" stroke-opacity=".5"/>
    <path d="M1155 450Q1086 603 962 697" stroke-opacity=".45"/>
  </g>
  <g fill="#CA561F">
    <circle cx="1409" cy="228" r="5"/><circle cx="1377" cy="193" r="3"/>
    <circle cx="1450" cy="276" r="4"/>
  </g>
  <g fill="#A8BCE6">
    <circle cx="944" cy="683" r="4"/><circle cx="1184" cy="254" r="3"/>
    <circle cx="1220" cy="631" r="3"/><circle cx="1071" cy="264" r="3"/>
  </g>
  <circle cx="1155" cy="450" r="7" fill="#FFE2C6"/>
  <circle cx="1155" cy="450" r="3" fill="#fff"/>
  <rect width="1600" height="900" fill="url(#shade)"/>
</svg>
