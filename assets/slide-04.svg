<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ePIC — exploring the structure of matter</title>
  <desc id="desc">Conceptual illustration of electron–proton scattering, with a magnified proton containing quarks and gluon-like connections, layered detector elements, and particles traveling toward a forward calorimeter. Blue and orange, with space on the left for a website headline. Geometry and particle trajectories are illustrative.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#111C36"/>
      <stop offset=".6" stop-color="#1C2B4E"/>
      <stop offset="1" stop-color="#30497C"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#4C6AAC" stop-opacity=".4"/>
      <stop offset="1" stop-color="#4C6AAC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="proton">
      <stop stop-color="#4C6AAC" stop-opacity=".5"/>
      <stop offset=".8" stop-color="#4C6AAC" stop-opacity=".15"/>
      <stop offset="1" stop-color="#A8BCE6" stop-opacity=".06"/>
    </radialGradient>
    <linearGradient id="beam">
      <stop stop-color="#CA561F" stop-opacity="0"/>
      <stop offset="1" stop-color="#F2A06C"/>
    </linearGradient>
    <linearGradient id="shade">
      <stop stop-color="#111C36" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#111C36" stop-opacity=".3"/>
      <stop offset="1" stop-color="#111C36" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#A8BCE6" stroke-opacity=".045"/>
    </pattern>
    <pattern id="crystals" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="2" y="2" width="14" height="14" rx="1" fill="#4C6AAC" fill-opacity=".45" stroke="#A8BCE6" stroke-opacity=".5"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1180" cy="430" rx="540" ry="470" fill="url(#halo)"/>
  <!-- An asymmetric detector silhouette evokes electron–ion scattering. -->
  <g transform="translate(1110 440)" fill="none">
    <ellipse rx="252" ry="297" stroke="#4C6AAC" stroke-width="25" stroke-opacity=".35"/>
    <ellipse rx="226" ry="270" stroke="#A8BCE6" stroke-opacity=".3" stroke-dasharray="3 11" stroke-width="8"/>
    <ellipse rx="196" ry="235" stroke="#CA561F" stroke-opacity=".55" stroke-width="13" stroke-dasharray="26 4"/>
    <ellipse rx="175" ry="210" stroke="#A8BCE6" stroke-opacity=".3"/>
    <ellipse rx="141" ry="168" stroke="#4C6AAC" stroke-opacity=".65" stroke-width="17"/>
    <ellipse rx="114" ry="137" stroke="#A8BCE6" stroke-opacity=".4" stroke-dasharray="1 7" stroke-width="3"/>
    <ellipse rx="82" ry="100" stroke="#A8BCE6" stroke-opacity=".3"/>
  </g>
  <g fill="none" stroke="#A8BCE6" stroke-opacity=".18">
    <path d="M986 181 1102 127Q1315 175 1362 440M986 699 1102 753Q1315 705 1362 440"/>
    <path d="M860 440H1510" stroke-dasharray="5 10"/>
    <path d="M1110 142V109M1110 738V771M858 440H827M1362 440H1390"/>
  </g>
  <!-- Incoming electron and proton beams. -->
  <path d="M670 493 1110 440" stroke="url(#beam)" stroke-width="2"/>
  <path d="M1600 440H1110" stroke="#A8BCE6" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="846" cy="472" r="6" fill="#F2A06C"/>
  <g transform="translate(1430 440)">
    <circle r="16" fill="#4C6AAC" stroke="#A8BCE6" stroke-opacity=".6"/>
    <circle cx="-5" cy="-5" r="3" fill="#F2A06C"/>
    <circle cx="6" cy="-3" r="3" fill="#A8BCE6"/>
    <circle cy="7" r="3" fill="#F2A06C"/>
  </g>
  <!-- Scattered electron and outgoing hadronic tracks. -->
  <g fill="none" stroke-linecap="round">
    <path d="M1110 440Q1040 350 929 276" stroke="#F2A06C" stroke-width="3"/>
    <path d="M1110 440Q1223 325 1358 289" stroke="#A8BCE6" stroke-width="2"/>
    <path d="M1110 440Q1267 391 1395 371" stroke="#A8BCE6" stroke-opacity=".65" stroke-width="1.5"/>
    <path d="M1110 440Q1247 537 1324 623" stroke="#A8BCE6" stroke-opacity=".7" stroke-width="2"/>
    <path d="M1110 440Q1177 542 1164 657" stroke="#A8BCE6" stroke-opacity=".45" stroke-width="1.5"/>
    <path d="M1110 440 1501 471" stroke="#F2A06C" stroke-width="2"/>
    <path d="M1110 440 1501 493" stroke="#F2A06C" stroke-opacity=".5"/>
  </g>
  <circle cx="929" cy="276" r="5" fill="#CA561F"/>
  <circle cx="1358" cy="289" r="4" fill="#A8BCE6"/>
  <circle cx="1110" cy="440" r="18" fill="#CA561F" fill-opacity=".17"/>
  <circle cx="1110" cy="440" r="6" fill="#FFE2C6"/>
  <!-- A stylized forward calorimeter, separated from the central detector. -->
  <g transform="translate(1500 423)">
    <path d="M0 0 28-16H100L72 0ZM72 0 100-16V110L72 126Z" fill="#4C6AAC" fill-opacity=".3" stroke="#A8BCE6" stroke-opacity=".4"/>
    <rect width="72" height="126" fill="#1C2B4E" stroke="#A8BCE6" stroke-opacity=".65"/>
    <rect width="72" height="126" fill="url(#crystals)"/>
    <rect x="2" y="38" width="14" height="14" fill="#CA561F"/>
    <rect x="2" y="56" width="14" height="14" fill="#CA561F" fill-opacity=".7"/>
  </g>
  <!-- Magnified conceptual view of quark–gluon structure. -->
  <path d="M1122 457 1315 651M1124 450 1463 630" fill="none" stroke="#A8BCE6" stroke-opacity=".22" stroke-dasharray="4 7"/>
  <g transform="translate(1374 718)">
    <circle r="111" fill="#1C2B4E" stroke="#A8BCE6" stroke-opacity=".35"/>
    <circle r="102" fill="url(#proton)"/>
    <ellipse rx="85" ry="65" transform="rotate(-25)" fill="none" stroke="#A8BCE6" stroke-opacity=".15"/>
    <g fill="none" stroke="#F2A06C" stroke-opacity=".8" stroke-width="1.5">
      <path d="M-46-26Q-38-48-27-29T-6-29T15-29T40-23"/>
      <path d="M40-23Q62-8 37 2T28 23T6 45"/>
      <path d="M6 45Q-15 53-15 30T-33 12T-46-26"/>
    </g>
    <g fill="#A8BCE6" fill-opacity=".25">
      <circle cx="-67" cy="18" r="3"/><circle cx="54" cy="39" r="4"/>
      <circle cx="12" cy="-66" r="3"/><circle cx="-24" cy="66" r="3"/>
    </g>
    <circle cx="-46" cy="-26" r="13" fill="#CA561F"/>
    <circle cx="40" cy="-23" r="13" fill="#4C6AAC" stroke="#A8BCE6" stroke-opacity=".8"/>
    <circle cx="6" cy="45" r="13" fill="#CA561F"/>
    <g fill="#FFE2C6">
      <circle cx="-49" cy="-30" r="3"/><circle cx="37" cy="-27" r="3"/><circle cx="3" cy="41" r="3"/>
    </g>
  </g>
  <rect width="1600" height="900" fill="url(#shade)"/>
</svg>
